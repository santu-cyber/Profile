# Deploys the static portfolio site to GitHub Pages on every push to main.
#
# One-time setup:
#   1. Repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
#   2. Push to main — this workflow runs automatically
#   3. Site is live at the URL shown under Settings → Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # uploads the whole repo root (index.html, photos, CV, QR, etc.)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
